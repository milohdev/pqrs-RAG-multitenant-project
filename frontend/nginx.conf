server {
    listen 80;
    server_name _;

    # Resolver de Docker: permite resolver el nombre "backend" en runtime, de modo
    # que nginx no falle en el arranque aunque el backend todavía esté iniciando.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Aplicación React (routing por hash: la URL siempre es /index.html).
    location / {
        try_files $uri /index.html;
    }

    # API del backend (el nombre "backend" es el del servicio en docker-compose).
    location /api/ {
        set $backend_api http://backend:8080;
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SignalR (WebSocket) del backend, con upgrade para conexiones en vivo.
    location /hubs {
        set $backend_hubs http://backend:8080;
        proxy_pass $backend_hubs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
